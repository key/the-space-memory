name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Build release binaries
        run: cargo build --release

      - name: Cache ruri-v3-30m model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/tsm-models
          key: ruri-v3-30m-model

      - name: Add binaries to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Download model
        run: tsm setup
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/tsm-models
          # `tsm setup` populates the machine-wide cache at `{cache_dir}/models/
          # ruri-v3-30m` (ADR-0008); it does not touch the workspace `.tsm/`. Pin
          # TSM_CACHE_DIR to an absolute `{workspace}/.tsm` so the install path is
          # explicit and matches the TSM_CACHE_DIR the test step points the
          # embedder at. TSM_STATE_DIR is irrelevant to setup but kept aligned.
          TSM_CACHE_DIR: ${{ github.workspace }}/.tsm
          TSM_STATE_DIR: ${{ github.workspace }}/.tsm

      - name: Run E2E tests
        run: bash tests/e2e.sh
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/tsm-models
          # The model was installed under `{workspace}/.tsm/models/ruri-v3-30m`
          # above. e2e.sh overrides TSM_STATE_DIR with a fresh mktemp dir, so the
          # embedder's workspace lookup is empty and it falls back to the machine-
          # wide cache (`cache_models_dir` = `{TSM_CACHE_DIR}/models/ruri-v3-30m`).
          # Point TSM_CACHE_DIR at the same `{workspace}/.tsm` so it resolves to
          # that install. (e2e.sh sets TSM_STATE_DIR but not TSM_CACHE_DIR.)
          TSM_CACHE_DIR: ${{ github.workspace }}/.tsm
