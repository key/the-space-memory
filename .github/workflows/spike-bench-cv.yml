name: Spike Bench CV

# Throwaway workflow to measure in-process search latency variance
# on ubuntu-latest before committing to a regression gate threshold.
# Calls `searcher::search()` directly via `examples/spike_search.rs` to
# isolate algorithm variance from CLI/process-spawn overhead.
#
# Triggered by pushes to spike/bench-cv-measurement (this branch only).
# workflow_dispatch is not available because it requires the workflow on
# the default branch.
#
# Output: artifact `spike-bench-cv-results` containing per-iteration timings
# and computed coefficient of variation.

on:
  push:
    branches:
      - spike/bench-cv-measurement

permissions:
  contents: read

jobs:
  measure-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSM_STATE_DIR: ${{ github.workspace }}/tsm-state
      TSM_INDEX_ROOT: ${{ github.workspace }}/bench-workspace
      TSM_EMBEDDER_IDLE_TIMEOUT: "0"
      HF_HUB_CACHE: ${{ github.workspace }}/tsm-models
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Build release binaries
        run: cargo build --release

      - name: Cache ruri-v3-30m model
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ github.workspace }}/tsm-models
          key: ruri-v3-30m-model

      - name: Add binaries to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Download model
        run: tsm setup

      - name: Prepare workspace and testdata
        run: |
          set -euo pipefail
          mkdir -p "$TSM_STATE_DIR" "$TSM_INDEX_ROOT"
          cp -r tests/e2e/testdata/* "$TSM_INDEX_ROOT/"

          today=$(date +%Y-%m-%d)
          one_y_ago=$(date -d '1 year ago' +%Y-%m-%d)
          three_m_ago=$(date -d '3 months ago' +%Y-%m-%d)
          find "$TSM_INDEX_ROOT" -type f \( -name "*.md" -o -name "*.jsonl" \) -exec \
            sed -i "s/__TODAY__/${today}/g; s/__1Y_AGO__/${one_y_ago}/g; s/__3M_AGO__/${three_m_ago}/g" {} +

      - name: Init and start daemon
        working-directory: ${{ env.TSM_INDEX_ROOT }}
        run: |
          set -euo pipefail
          tsm init
          tsm start

          # Wait for embedder to become ready (model load can take a while)
          # `tsm status` formats with multiple spaces; match loosely.
          for i in $(seq 1 90); do
            if tsm status 2>/dev/null | grep -qE "Embedder:[[:space:]]+running"; then
              echo "Embedder ready after $((i * 2))s"
              tsm status
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: embedder did not become ready" >&2
          tsm status || true
          exit 1

      - name: Index testdata once
        working-directory: ${{ env.TSM_INDEX_ROOT }}
        run: |
          set -euo pipefail
          tsm index >/dev/null
          # Wait briefly for backfill to settle
          sleep 5
          tsm status

      - name: Run in-process search spike
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/spike-results"
          cargo run --release --example spike_search \
            > "${GITHUB_WORKSPACE}/spike-results/summary.json"
          echo "--- summary ---"
          cat "${GITHUB_WORKSPACE}/spike-results/summary.json" | head -20

          tsm stop || true

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spike-bench-cv-results
          path: spike-results/
