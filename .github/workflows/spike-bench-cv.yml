name: Spike Bench CV

# Throwaway workflow to measure wall-clock variance of `tsm rebuild --force`
# on ubuntu-latest before committing to a 5% regression gate threshold.
#
# Run via: gh workflow run "Spike Bench CV" --ref spike/bench-cv-measurement
#
# Output: artifact `spike-bench-cv-results` containing per-iteration timings
# and computed coefficient of variation.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSM_STATE_DIR: ${{ github.workspace }}/tsm-state
      TSM_INDEX_ROOT: ${{ github.workspace }}/bench-workspace
      TSM_EMBEDDER_IDLE_TIMEOUT: "0"
      HF_HUB_CACHE: ${{ github.workspace }}/tsm-models
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Build release binaries
        run: cargo build --release

      - name: Cache ruri-v3-30m model
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ github.workspace }}/tsm-models
          key: ruri-v3-30m-model

      - name: Add binaries to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Download model
        run: tsm setup

      - name: Prepare workspace and testdata
        run: |
          set -euo pipefail
          mkdir -p "$TSM_STATE_DIR" "$TSM_INDEX_ROOT"
          cp -r tests/e2e/testdata/* "$TSM_INDEX_ROOT/"

          today=$(date +%Y-%m-%d)
          one_y_ago=$(date -d '1 year ago' +%Y-%m-%d)
          three_m_ago=$(date -d '3 months ago' +%Y-%m-%d)
          find "$TSM_INDEX_ROOT" -type f \( -name "*.md" -o -name "*.jsonl" \) -exec \
            sed -i "s/__TODAY__/${today}/g; s/__1Y_AGO__/${one_y_ago}/g; s/__3M_AGO__/${three_m_ago}/g" {} +

      - name: Init and start daemon
        working-directory: ${{ env.TSM_INDEX_ROOT }}
        run: |
          set -euo pipefail
          tsm init
          tsm start

          # Wait for embedder to become ready (model load can take a while)
          for i in $(seq 1 90); do
            if tsm status 2>/dev/null | grep -q "Embedder: running"; then
              echo "Embedder ready after ${i}*2s"
              tsm status
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: embedder did not become ready" >&2
          tsm status || true
          exit 1

      - name: Run 10 iterations of full rebuild
        working-directory: ${{ env.TSM_INDEX_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/spike-results"
          out="${GITHUB_WORKSPACE}/spike-results/measurements.jsonl"
          : > "$out"

          for i in $(seq 1 10); do
            echo "=== Iteration ${i} ==="
            start=$(date +%s.%N)
            tsm rebuild --force >/dev/null
            end=$(date +%s.%N)
            elapsed=$(python3 -c "print(${end} - ${start})")
            printf '{"iteration": %d, "elapsed_seconds": %s}\n' "$i" "$elapsed" >> "$out"
            tail -1 "$out"
          done

          tsm stop || true

      - name: Compute CV statistics
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          values = []
          for line in Path("spike-results/measurements.jsonl").read_text().splitlines():
              d = json.loads(line)
              values.append(d["elapsed_seconds"])

          # Drop the first (warmup) and compute on the rest
          warm = values[1:]
          mean = statistics.mean(warm)
          stdev = statistics.stdev(warm)
          cv = (stdev / mean) * 100

          summary = {
              "iterations_total": len(values),
              "iterations_used_for_cv": len(warm),
              "values_seconds_all": values,
              "values_seconds_used": warm,
              "mean_seconds": round(mean, 4),
              "stdev_seconds": round(stdev, 4),
              "cv_percent": round(cv, 2),
              "min_seconds": round(min(warm), 4),
              "max_seconds": round(max(warm), 4),
          }

          print(json.dumps(summary, indent=2))
          Path("spike-results/summary.json").write_text(json.dumps(summary, indent=2))
          PY

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spike-bench-cv-results
          path: spike-results/
