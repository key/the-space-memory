name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Build release binaries
        run: cargo build --release

      - name: Cache ruri-v3-30m model
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ runner.temp }}/tsm-models
          key: ruri-v3-30m-model

      - name: Add binaries to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Download model
        run: tsm setup
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/tsm-models
          # `tsm setup` installs the model to `{state_dir}/models/ruri-v3-30m`.
          # Pin state_dir to an absolute `{workspace}/.tsm` so the install path is
          # explicit (not dependent on the step's CWD) and matches the TSM_CACHE_DIR
          # the test step points the embedder at.
          TSM_STATE_DIR: ${{ github.workspace }}/.tsm

      - name: Run E2E tests
        run: bash tests/e2e.sh
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/tsm-models
          # The model was installed under `{workspace}/.tsm/models/ruri-v3-30m`
          # above. e2e.sh overrides TSM_STATE_DIR with a fresh mktemp dir, so the
          # embedder's workspace lookup is empty and it falls back to the machine-
          # wide cache (`cache_models_dir` = `{TSM_CACHE_DIR}/models/ruri-v3-30m`).
          # Point TSM_CACHE_DIR at the same `{workspace}/.tsm` so it resolves to
          # that install. (e2e.sh sets TSM_STATE_DIR but not TSM_CACHE_DIR.)
          TSM_CACHE_DIR: ${{ github.workspace }}/.tsm
