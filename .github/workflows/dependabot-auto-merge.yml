name: Dependabot Auto-merge

# Merge a green Dependabot pull request without a human in the loop.
#
# Why `workflow_run` instead of GitHub's native auto-merge: enabling auto-merge
# needs a required status check to wait on, and this repository has none — every
# pull request reports CLEAN the moment it opens. Marking the existing checks
# required is not a drop-in replacement either, because CI, E2E, Quality and
# Bench are path-filtered: a pull request touching only `.github/workflows/**`
# produces no check at all for them, so a required check would stay pending
# forever and block every pull request, with no bypass actor to rescue it.
# Reacting to completed workflow runs and inspecting whichever checks actually
# exist for the head commit sidesteps both problems and leaves the repository's
# merge policy untouched.
#
# `workflow_run` is also how a Dependabot-originated workflow gets a
# write-capable GITHUB_TOKEN: the read-only-token restriction covers
# `pull_request`, `push`, `create` and friends, not this event.

on:
  workflow_run:
    # Every workflow that can report a check on a Dependabot pull request. Each
    # completion re-evaluates the whole check set, so whichever finishes last is
    # the one that merges — which means a workflow missing from this list can
    # never resume an evaluation that is waiting on its check, leaving a green
    # pull request open forever. `scripts/lint-automerge-triggers.sh` keeps the
    # list honest; do not edit one without the other.
    #
    # `PR Labeler` is deliberately absent: it runs on `pull_request_target`, so
    # its payload carries the base branch and would never match the branch
    # filter below — its `label` and `breaking` checks are still counted when
    # the check set is inspected.
    workflows: [CI, Lint, E2E, Quality, Bench, Code Metrics, DevContainer]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Serialize per pull request so two workflows finishing together cannot both
  # decide to merge. Never cancel: a cancelled run is a lost evaluation, and the
  # event that would have re-triggered it has already been consumed.
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: dependabot-auto-merge
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # In a `workflow_run` context GITHUB_SHA is the default branch head,
          # so this checks out main and never the pull request being judged.
          # Only the decision script is needed, and `gh` authenticates from
          # GH_TOKEN rather than the checkout's stored credentials.
          sparse-checkout: scripts
          persist-credentials: false

      - name: Merge when the pull request is eligible and every check is green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Pull request text is untrusted: read it from JSON into variables,
          # never interpolate it into this script.
          pr_json=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
            --json number,title,author,headRefOid,baseRefName --limit 1)

          if [[ $(jq 'length' <<<"$pr_json") -ne 1 ]]; then
            echo "::notice::no open pull request for $HEAD_BRANCH"
            exit 0
          fi

          author=$(jq -r '.[0].author.login' <<<"$pr_json")
          if [[ "$author" != "app/dependabot" ]]; then
            echo "::notice::$HEAD_BRANCH is not authored by Dependabot (author: $author)"
            exit 0
          fi

          pr_number=$(jq -r '.[0].number' <<<"$pr_json")
          pr_title=$(jq -r '.[0].title' <<<"$pr_json")
          pr_head=$(jq -r '.[0].headRefOid' <<<"$pr_json")
          base_branch=$(jq -r '.[0].baseRefName' <<<"$pr_json")

          # A push that landed after the triggering run started invalidates its
          # result. The checks for the new head fire their own events. This is
          # an early exit only — it saves the work below but proves nothing
          # about the moment of the merge, which `--match-head-commit` does.
          if [[ "$pr_head" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$pr_number moved on ($HEAD_SHA -> $pr_head); waiting for its new checks"
            exit 0
          fi

          decision_reason=$(mktemp)
          verdict=$(scripts/dependabot-automerge-decision.sh "$HEAD_BRANCH" "$pr_title" 2>"$decision_reason")
          reason=$(<"$decision_reason")
          if [[ "$verdict" != "merge" ]]; then
            echo "::notice::PR #$pr_number held for review: $reason"
            exit 0
          fi

          # Wait only on things whose completion can wake this workflow up.
          #
          # `event=pull_request` is exactly that set. A run from any other event
          # cannot re-trigger an evaluation: `pull_request_target` (PR Labeler)
          # reports its checks on this commit but its workflow_run payload
          # carries the base branch, so it never matches the branch filter
          # above. Waiting on such a check is a permanent stall — nothing will
          # ever look again — and it is an invisible one, because the run that
          # gave up exited green. `scripts/lint-automerge-triggers.sh` closes
          # the other half of this: it guarantees every pull_request workflow
          # appears in the trigger list, so everything counted here can wake us.
          #
          # Only the runs that exist are inspected, which is what makes the path
          # filters harmless: a workflow that never ran is nothing to wait on.
          runs=$(gh api --paginate \
            "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
            --jq '.workflow_runs[] | [.name, .status, (.conclusion // "")] | @tsv')

          # Every exit below this point except this one is "wait for the next
          # event". This workflow only runs because a pull_request-triggered
          # workflow completed at this commit, so an empty set means the query
          # is broken. Fail loudly: a stall that shows up as a green run nobody
          # reads is worse than a red one.
          if [[ -z "$runs" ]]; then
            echo "::error::no pull_request workflow runs found for $HEAD_SHA; cannot evaluate PR #$pr_number"
            exit 1
          fi

          incomplete=$(awk -F'\t' '$2 != "completed" { printf "%s ", $1 }' <<<"$runs")
          if [[ -n "$incomplete" ]]; then
            echo "::notice::PR #$pr_number still running: $incomplete"
            exit 0
          fi

          # `skipped` and `neutral` are how a conditional workflow reports
          # "nothing to do" — they are not failures.
          unsuccessful=$(awk -F'\t' \
            '$3 != "success" && $3 != "skipped" && $3 != "neutral" { printf "%s(%s) ", $1, $3 }' <<<"$runs")
          if [[ -n "$unsuccessful" ]]; then
            echo "::notice::PR #$pr_number is not green: $unsuccessful"
            exit 0
          fi

          # Checks from outside that set — PR Labeler, and any third-party app —
          # are not waited on, but a verdict they have already reached is still
          # respected. Ignoring a pending one costs nothing; ignoring a red one
          # would merge over a stated objection. A red check here holds the pull
          # request until a human looks, which is a visible stop, not a stall.
          objections=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[]
                  | select(.status == "completed")
                  | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")
                  | "\(.name)(\(.conclusion // "none"))"')
          if [[ -n "$objections" ]]; then
            echo "::notice::PR #$pr_number held by a check outside the trigger set: $(tr '\n' ' ' <<<"$objections")"
            exit 0
          fi

          # GitHub computes mergeability asynchronously and reports UNKNOWN
          # until it settles; give it a moment before believing the answer.
          mergeable=UNKNOWN
          for _ in 1 2 3; do
            mergeable=$(gh pr view "$pr_number" --repo "$REPO" --json mergeable --jq '.mergeable')
            if [[ "$mergeable" != "UNKNOWN" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$mergeable" != "MERGEABLE" ]]; then
            # A conflicting Dependabot pull request is normal once a sibling
            # lands; Dependabot rebases it, and the new checks retry this.
            echo "::notice::PR #$pr_number is not mergeable ($mergeable); waiting for Dependabot to rebase"
            exit 0
          fi

          # A `pull_request` run tests the merge ref — this head merged into the
          # base as it stood then. Once the base moves, the combination that
          # would land is one nothing ever built, which is what "require
          # branches to be up to date" prevents on repositories that enforce it.
          #
          # Refusing here waits for Dependabot's next scheduled run to rebase:
          # `rebase-strategy` defaults to `auto`, which rebases on conflict, on
          # schedule, on reopen — but not for a branch that is merely behind. So
          # this wait is bounded by the update interval, the same cadence at
          # which these pull requests arrive. That is the difference from the
          # `pull_request_target` case above, which had no mechanism that could
          # ever resume it; do not mistake this one for that and bolt on a
          # rebase nudge, which costs a full CI cycle per pull request and puts
          # a non-Dependabot commit on a Dependabot branch.
          behind=$(gh api "repos/$REPO/compare/$base_branch...$HEAD_SHA" --jq '.behind_by')
          if [[ "$behind" -ne 0 ]]; then
            echo "::notice::PR #$pr_number is $behind commit(s) behind $base_branch, so its checks" \
                 "tested a stale merge; waiting for Dependabot to rebase"
            exit 0
          fi

          # `--match-head-commit` pins the head: the commit that lands is the
          # commit whose checks were inspected. Everything above reads the head
          # at a point in time and then does more I/O, so a rebase in between
          # would otherwise merge a revision nothing has checked — and
          # Dependabot rebases exactly when a sibling pull request lands, which
          # this workflow itself causes. GitHub rejects the merge on mismatch.
          #
          # Nothing available here pins the *base* the same way, so the window
          # between the check above and this merge stays open; closing it needs
          # a merge queue, which this repository has deliberately not adopted.
          #
          # The branch is removed by the repository's delete-branch-on-merge
          # setting, and there is no review requirement to approve away.
          if gh pr merge "$pr_number" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"; then
            echo "::notice::merged PR #$pr_number: $reason"
            exit 0
          fi

          # Distinguish the expected rejection from a real failure by re-reading
          # the head rather than by matching on GitHub's error text.
          current_head=$(gh pr view "$pr_number" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [[ "$current_head" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$pr_number moved to $current_head mid-merge; waiting for its new checks"
            exit 0
          fi
          echo "::error::merging PR #$pr_number failed while its head was still $HEAD_SHA"
          exit 1
