name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/quality_bench.rs"
      - "tests/quality_bench.sh"
      - "tests/golden/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "src/**"
      - "tests/quality_bench.rs"
      - "tests/quality_bench.sh"
      - "tests/golden/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Build release binaries
        run: cargo build --release

      - name: Cache ruri-v3-30m model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/tsm-models
          key: ruri-v3-30m-model

      - name: Add binaries to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run quality benchmark
        run: bash tests/quality_bench.sh
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/tsm-models
          # See .github/workflows/e2e.yml for why TSM_CACHE_DIR is pinned to
          # the same workspace path across the setup and test steps.
          TSM_CACHE_DIR: ${{ github.workspace }}/.tsm
