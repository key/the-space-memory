name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Run tests (bench-counters feature)
        run: cargo test --features bench-counters

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: cargo-llvm-cov

      - name: Coverage (90% minimum)
        run: >-
          cargo llvm-cov
          --ignore-filename-regex
          '(main|cli|_proc|model_loader)\.rs'
          --fail-under-lines 90

  file-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Invariant 3 (ADR-0018) compares the baseline against origin/main.
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin main

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Per-file line-count gate (ADR-0018)
        # Strict mode: this job fetched origin/main, so an unresolvable base is a
        # setup failure and fails closed (invariant 3 is authoritative here).
        env:
          TSM_FILE_LINE_GATE_STRICT: "1"
        run: cargo test --test file_line_limits -- --nocapture

  arm64-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - name: Install cross
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: cross

      # cross uses Docker-based builds; rust-cache is not applicable here
      - name: Build (aarch64-linux)
        env:
          RUSTFLAGS: "-C target-feature=+fp16"
        run: cross build --target aarch64-unknown-linux-gnu
