name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # Both Linux targets build via `cross` (Docker, Ubuntu 20.04
          # base, glibc 2.31). Building x86_64 natively on
          # ubuntu-latest pulls in the runner's glibc (currently 2.39),
          # which produces binaries that fail to start on Debian 11 /
          # Ubuntu 20.04 / RHEL 8 with `version 'GLIBC_2.34' not found`.
          # The cross image stays pinned to glibc 2.31, so the same
          # archive runs on the older long-term-support distros.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: linux-x86_64
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: darwin-arm64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_name: linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # cross uses Docker-based builds; rust-cache is not applicable here
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        if: ${{ !matrix.use_cross }}
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419  # v2.82.7
        with:
          tool: cross

      - name: Build release binaries (cross)
        if: matrix.use_cross
        env:
          RUSTFLAGS: "-C target-feature=+fp16"
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binaries
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        env:
          TAG: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          TARGET: ${{ matrix.target }}
        run: |
          DIR="tsm-${TAG}-${ARCHIVE_NAME}"
          mkdir -p "${DIR}/bin" "${DIR}/data" "${DIR}/docs"
          cp "target/${TARGET}/release/tsm" "${DIR}/bin/"
          cp "target/${TARGET}/release/tsmd" "${DIR}/bin/"
          cp README.md LICENSE tsm.toml.example "${DIR}/"
          cp data/stopwords.txt "${DIR}/data/"
          cp docs/user-dictionary.md "${DIR}/docs/"
          tar czf "${DIR}.tar.gz" "${DIR}"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tsm-${{ matrix.archive_name }}
          path: tsm-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          for f in tsm-*.tar.gz; do
            sha256sum "${f}" > "${f}.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true
          files: |
            tsm-*.tar.gz
            tsm-*.tar.gz.sha256
