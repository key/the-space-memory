# Golden query set for search quality benchmarking (tests/quality_bench.rs).
#
# Each query carries hand-authored relevance judgments against the corpus
# under tests/golden/corpus/. `doc` paths are relative to the corpus root
# (and to the indexed project root, since the harness copies the corpus
# directory as-is). Grade is 0-2: 2 = highly relevant (the document's
# primary topic matches the query), 1 = relevant (same topic area but a
# secondary match), and any document NOT listed for a query is implicitly
# grade 0 (irrelevant).
#
# Category taxonomy loosely follows tests/search-test-patterns.md, but this
# corpus and these queries are purpose-built for automated grading and are
# independent of that document's illustrative (unindexed) examples:
#   entity          (E)  — proper-noun / tag-driven keyword search
#   fts-basic       (F)  — plain multi-term FTS5 AND search
#   vector-semantic (V)  — paraphrase queries with low lexical overlap,
#                          intended to only be findable via vector search
#   mixed           (R)  — combined FTS + entity signal
#   temporal        (T)  — natural-language time expressions + filtering
#   distractor      (G)  — control query confirming the unrelated garden
#                          cluster doesn't leak into other topics' results
queries:
  - id: E1
    category: entity
    query: "lindera"
    relevant:
      - doc: search-engine/lindera-tokenizer.md
        grade: 2
      - doc: search-engine/sqlite-fts5.md
        grade: 1

  - id: E2
    category: entity
    query: "LoRa"
