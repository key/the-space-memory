[package]
name = "the-space-memory"
version = "0.9.0"
edition = "2021"

[[bin]]
name = "tsm"
path = "src/main.rs"

[[bin]]
name = "tsmd"
path = "src/bin/tsmd/main.rs"

[[bin]]
name = "tsm-bench-check"
path = "src/bin/tsm-bench-check/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "load_extension"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "anyhow"] }
lindera = { version = "2.3", features = ["embed-ipadic"] }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "0.5", default-features = false, features = [
  "tokio",
  "ureq",
  "rustls-tls",
] }
sqlite-vec = "0.1.9"
tokenizers = "0.22"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "1.1"
regex = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
sha2 = "0.11"
libc = "0.2"
log = "0.4"
flexi_logger = { version = "0.31", features = ["colors"] }
notify = "8"
ignore = "0.4"
ureq = "3"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
criterion = { version = "0.8", default-features = false }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }

[features]
# Enables atomic counters in production code (e.g. embedder client) for bench instrumentation.
# Off by default; release builds compile the counters out entirely.
bench-counters = []

[[bench]]
name = "search_latency"
harness = false

[[bench]]
name = "record_metrics"
harness = false
required-features = ["bench-counters"]
